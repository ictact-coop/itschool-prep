# Cloudflare Pages 설정. 비밀값(RESEND_API_KEY, TURNSTILE_SECRET, RATE_SALT)은
# 대시보드 또는 `wrangler pages secret put`으로 넣고 이 파일에 쓰지 않는다.
name = "itschool-prep"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "itschool-prep"
database_id = "00000000-0000-0000-0000-000000000000" # Cloudflare에서 만든 뒤 실제 ID로 교체

[vars]
# 아래 셋은 정해지면 채운다. 비어 있으면 해당 메일을 보내지 않는다.
MAIL_FROM = ""        # 예: "IT학교 설립추진위원회 <noreply@itschool.ictact.kr>"
NOTIFY_TO = ""        # 담당자 수신 주소(쉼표로 여러 개)
SITE_URL = "https://itschool.ictact.kr"

# Cloudflare Workers(정적 자산 + Worker) 설정.
# 비밀값(RESEND_API_KEY, TURNSTILE_SECRET, RATE_SALT)은 대시보드(Worker → Settings → Variables and Secrets)
# 또는 `npx wrangler secret put <이름>`으로 넣고 이 파일에 쓰지 않는다.
name = "itschool-prep"          # Cloudflare의 Worker 이름과 같아야 한다
main = "src/worker.ts"
compatibility_date = "2026-11-01"

# `wrangler deploy`/`wrangler dev` 직전에 사이트를 빌드한다(대시보드 빌드 명령이 비어 있어도 동작).
[build]
command = "npm run build"

# 빌드된 정적 파일. 파일이 없는 경로(/api/*)만 Worker가 처리한다.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "itschool-prep"
database_id = "7a02b40b-78bc-4aca-9fe2-8a2fbdd11274"
migrations_dir = "migrations"

[vars]
# 발신 주소. 신청자 접수 확인 메일의 회신 주소로도 쓴다.
MAIL_FROM = "IT학교 설립준비위원회 <itschool@ictact.kr>"
# 담당자 알림 수신 주소(NOTIFY_TO)는 개인 주소가 포함되어 공개 저장소에 두지 않는다.
# Worker Secret으로 등록한다: Settings → Variables and Secrets → Secret "NOTIFY_TO"
SITE_URL = "https://itschool.ictact.kr"
